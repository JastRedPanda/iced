[package]
name = "iced_graphics"
description = "A bunch of backend-agnostic types that can be leveraged to build a renderer for iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
geometry = ["lyon_path"]
image = ["dep:image", "kamadak-exif"]
svg = []
web-colors = []
fira-sans = []

[dependencies]
iced_core.workspace = true
iced_futures.workspace = true

bitflags.workspace = true
bytemuck.workspace = true
cosmic-text.workspace = true
half.workspace = true
log.workspace = true
raw-window-handle.workspace = true
rustc-hash.workspace = true
# WMDE: text::system_fonts picks the locale the way cosmic-text would have picked it.
# Already in the graph - cosmic-text depends on it - so this costs no extra compilation.
sys-locale.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true

image.workspace = true
image.optional = true

kamadak-exif.workspace = true
kamadak-exif.optional = true

lyon_path.workspace = true
lyon_path.optional = true

# WMDE: text::system_fonts repeats fontdb's fontconfig directory discovery so the parallel
# font scan sees exactly the files fontdb would have seen. Same crate fontdb itself uses,
# and gated to the same targets as the code that calls it.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android")))'.dependencies]
fontconfig-parser.workspace = true
