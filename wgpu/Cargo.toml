[package]
name = "iced_wgpu"
description = "A renderer for iced on top of wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
# WMDE: WMDE is a Linux/Wayland-only desktop, so Vulkan is the only backend
# requested. This is the single place in the whole graph (libcosmic -> iced ->
# iced_renderer -> iced_wgpu) that names `wgpu/default`, which is what drags in
# dx12/metal/webgpu/gles; `std` and `wgsl` keep arriving through the workspace
# dependency declaration in iced/Cargo.toml, giving a final set of exactly
# ["std", "wgsl", "vulkan"].
#
# GL is deliberately absent, and that is the point rather than a side effect.
# There is no way to tell a hardware GL driver from Mesa's llvmpipe without
# loading Mesa and asking it, and a `/dev/dri/renderD*` node proves nothing (the
# GPU-less test VM has one, served by llvmpipe). Measured on that VM with GL
# still compiled in: the probe alone cost 27 MB of resident libLLVM/libEGL that
# is never unloaded, and pushed peak RSS to 200 MB against 48 MB for a plain
# tiny-skia start. Without the GL backend there is nothing to probe, so a machine
# with no Vulkan driver falls straight through to tiny-skia and never maps Mesa.
#
# The trade is that hardware old enough to have GL but no Vulkan (roughly
# pre-2014 Intel, pre-GCN AMD, nouveau before Turing) renders on the CPU. That is
# an accepted trade: on that class of hardware tiny-skia is likely faster than the
# aging GL driver anyway.
#
# Note this also drops wgpu's `parking_lot` feature. That does NOT touch
# wgpu-core, which depends on parking_lot unconditionally; it only switches the
# `Mutex` of the wgpu facade itself (src/util/mutex.rs, used by api/buffer.rs,
# api/surface.rs, api/device.rs and backend/wgpu_core.rs) over to the std
# primitives. A build for Windows/macOS/wasm would have to add dx12/metal back
# here - it would still compile, but would find no adapter at runtime.
default = ["wgpu/vulkan"]
geometry = ["iced_graphics/geometry", "lyon"]
image = ["iced_graphics/image"]
svg = ["iced_graphics/svg", "resvg/text"]
web-colors = ["iced_graphics/web-colors"]
webgl = ["wgpu/webgl"]
strict-assertions = []
wayland = ["cctk"]

[dependencies]
iced_debug.workspace = true
iced_graphics.workspace = true

bitflags.workspace = true
bytemuck.workspace = true
futures.workspace = true
glam.workspace = true
cryoglyph.workspace = true
guillotiere.workspace = true
log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
wgpu.workspace = true

lyon.workspace = true
lyon.optional = true

resvg.workspace = true
resvg.optional = true

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "redox")))'.dependencies]

rustix = { version = "0.38", features = ["fs"] }
raw-window-handle.workspace = true
cctk.workspace = true
cctk.optional = true
wayland-protocols.workspace = true
wayland-backend = { version = "0.3.3", features = ["client_system"] }
wayland-client = { version = "0.31.2" }
wayland-sys = { version = "0.31.1", features = ["dlopen"] }
as-raw-xcb-connection = "1.0.1"
tiny-xlib = "0.2.3"
x11rb = { version = "0.13.1", features = [
    "allow-unsafe-code",
    "dl-libxcb",
    "dri3",
    "randr",
] }

[build-dependencies]
build_helpers = { path = "../build_helpers" }
